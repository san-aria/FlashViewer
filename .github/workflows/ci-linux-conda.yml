name: CI Linux (conda)

# Optional, secondary build path: builds FlashViewer on Linux entirely from
# conda-forge (deps + Qt6), with no system -dev packages. Verification only
# (build + test) — the native lane (ci-linux.yml) owns artifact production.

on:
  push:
    branches: [main, "claude/**", "v*-claude"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        # Login shell so the conda env activated by setup-miniconda persists
        # across steps (no explicit `conda activate` needed).
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime system libs (xcb plugin + GL + headless)
        # conda supplies the build/link deps; the conda Qt xcb platform plugin
        # still needs these *system* runtime libs present, and GL/xvfb are needed
        # for the headless test run (see environment-linux.yml pitfall notes).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb

      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-linux.yml
          activate-environment: flashviewer-linux
          auto-activate-base: false

      - name: Configure
        run: cmake --preset linux-release -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Test (headless)
        run: |
          cd build/linux-release
          xvfb-run -a ctest --output-on-failure
